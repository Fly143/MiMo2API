plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mimo2api.app'
    compileSdk 35

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId "com.mimo2api.app"
        minSdk 24
        targetSdk 35
        versionCode 4
                versionName "2.5.3"

        ndk {
            abiFilters 'arm64-v8a'
        }

        python {
            version "3.11"
            // buildPython由环境自动检测（移除硬编码路径）

            pip {
                install "fastapi==0.115.5"
                install "uvicorn==0.32.1"
                install "httpx==0.27.2"
                install "pydantic<2"
                install "python-multipart==0.0.20"
            }

            pyc {
                src false
            }
        }
    }

    // 签名：仓库不含 keystore（敏感）。存在 release.keystore 时用 release 签名；
    // 不存在时回退 debug 签名，保证 clone 后可直接构建安装。
    def hasReleaseKey = file('../release.keystore').exists()
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file('../release.keystore')
                storePassword 'mimo2api123'
                keyAlias 'mimo2api'
                keyPassword 'mimo2api123'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
