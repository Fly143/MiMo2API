plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mimo2api.app'
    compileSdk 35

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId "com.mimo2api.app"
        minSdk 24
        targetSdk 35
        versionCode 6
                versionName "2.5.6"

        ndk {
            abiFilters 'arm64-v8a'
        }

        python {
            version "3.11"
            // buildPython鐢辩幆澧冭嚜鍔ㄦ娴嬶紙绉婚櫎纭紪鐮佽矾寰勶級

            pip {
                install "fastapi==0.115.5"
                install "uvicorn==0.32.1"
                install "httpx==0.27.2"
                install "pydantic<2"
                install "python-multipart==0.0.20"
            }

            pyc {
                src false
            }
        }
    }

    // 绛惧悕锛氫粨搴撲笉鍚?keystore锛堟晱鎰燂級銆傚瓨鍦?release.keystore 鏃剁敤 release 绛惧悕锛?
    // 涓嶅瓨鍦ㄦ椂鍥為€€ debug 绛惧悕锛屼繚璇?clone 鍚庡彲鐩存帴鏋勫缓瀹夎銆?
    def hasReleaseKey = file('../release.keystore').exists()
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file('../release.keystore')
                storePassword 'mimo2api123'
                keyAlias 'mimo2api'
                keyPassword 'mimo2api123'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}
